<title>holographic photocard</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);

<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
:root{--hx:50%;--hy:50%;--hop:.42}
body{user-select:none;-webkit-user-select:none}
.holo{position:relative;width:min(390px,90vw,calc(92vh*0.7500));aspect-ratio:3 / 4;perspective:1200px;cursor:pointer;touch-action:manipulation}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));transition:transform .32s cubic-bezier(.2,.75,.25,1)}
.holo.moving .tilt{transition:transform .06s linear}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.2,.8,.3,1.04);will-change:transform}
.holo.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;border-radius:0;background:transparent;box-shadow:none}
.face.back{transform:rotateY(180deg)}
.photo{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform}
.foil,.holo-specks{position:absolute;inset:-22%;pointer-events:none;mix-blend-mode:screen;opacity:var(--hop);transform:translate3d(calc((var(--hx) - 50%)*-.15),calc((var(--hy) - 50%)*-.15),0);will-change:transform,background-position}
.foil.aurora{background:radial-gradient(circle at var(--hx) var(--hy),rgba(255,255,255,.88) 0 3%,transparent 20%),conic-gradient(from 210deg at var(--hx) var(--hy),rgba(110,255,239,.75),rgba(135,146,255,.63),rgba(255,127,213,.62),rgba(255,222,121,.5),rgba(110,255,239,.75));filter:blur(7px) saturate(1.22)}
.foil.prism{background:linear-gradient(115deg,transparent 24%,rgba(126,255,235,.68) 34%,rgba(136,154,255,.7) 44%,rgba(255,128,223,.66) 54%,rgba(255,230,143,.6) 64%,transparent 76%);background-size:180% 180%;background-position:var(--hx) var(--hy);filter:saturate(1.25)}
.foil.stars{background:radial-gradient(circle at var(--hx) var(--hy),rgba(255,255,255,.9),transparent 23%),repeating-radial-gradient(circle at 18% 26%,rgba(255,255,255,.72) 0 1px,transparent 2px 23px),linear-gradient(125deg,rgba(96,247,255,.28),rgba(190,117,255,.42),rgba(255,139,193,.3));filter:saturate(1.2)}
.holo-specks{inset:0;opacity:.36;background:radial-gradient(circle at 16% 18%,white 0 1px,transparent 2px),radial-gradient(circle at 77% 28%,white 0 1.3px,transparent 2.2px),radial-gradient(circle at 28% 72%,white 0 1px,transparent 2px),radial-gradient(circle at 84% 82%,white 0 1px,transparent 2px);filter:drop-shadow(0 0 4px rgba(190,246,255,.9))}
.rim{position:absolute;z-index:8;inset:0;border-radius:0;pointer-events:none;box-shadow:none}
.holo::after{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:-5%;height:10%;border-radius:50%;background:radial-gradient(ellipse,rgba(16,24,38,.32),transparent 70%);filter:blur(8px)}
.holo.editing{cursor:default}.holo.editing .tilt{transform:none!important;transition:none!important}.holo.editing .inner{transition:none!important}
.holo.editing.front-edit .inner{transform:rotateY(0)!important}.holo.editing.back-edit .inner{transform:rotateY(180deg)!important}
.holo.editing .foil,.holo.editing .holo-specks{display:none}
@media (prefers-reduced-motion:reduce){.tilt{transform:none!important;transition:none!important}.inner{transition:none!important}}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>
